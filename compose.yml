services:
  sveltekit:
    container_name: terra-prime-sveltekit
    build:
      context: ./site
      dockerfile: dockerfile
      target: dev
    ports:
      - 5173:5173
    volumes:
      - ./site:/app
      - /app/node_modules
    env_file:
      - ./site/.env
    environment:
      - MYSQLHOST=db
      - MYSQLPORT=3306
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    container_name: terra-prime-db
    image: mysql/mysql-server:latest
    ports:
      - 3307:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=testaliceDB
      - MYSQL_USER=yodi
      - MYSQL_PASSWORD=Tester@123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  migrate:
    container_name: terra-prime-migrate
    build:
      context: ./site
      dockerfile: dockerfile
      target: migrate-runner
    env_file:
      - ./site/.env
    environment:
      - MYSQLHOST=db
      - MYSQLPORT=3306
    depends_on:
      db:
        condition: service_healthy

  phpnyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8081:80
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    stdin_open: true

  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate  run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiMjliYTJlMmJiMmM1NjUwNTJiZGZlZjMwOTczYjY0NmYiLCJ0IjoiN2ZkZGIwODUtOTBkOS00ZjcwLWJhNjQtNzFiODU3ODQxYTM2IiwicyI6Ik1UTmtNelZtTmpNdFpUQmlPQzAwTkdSakxXSXdOalV0TW1Fd01HUmlPV1k1TWpkbCJ9

