services:
  sveltekit:
    container_name: terra-prime-sveltekit
    build:
      context: ./site
      dockerfile: dockerfile
      target: dev
    ports:
      - 5173:5173
    volumes:
      - ./site:/app
      - /app/node_modules
    env_file:
      - ./site/.env
    environment:
      - MYSQLHOST=db
      - MYSQLPORT=3306
      - MYSQLUSER=yodi
      - MYSQLPASSWORD=Tester@123
      - MYSQLDATABASE=testaliceDB
      # `vite dev` starts the bridge through the `realtime-bridge` plugin in `vite.config.ts`.
      - MQTT_URL=mqtt://mqtt:1883
      - MQTT_USERNAME=tp-bridge
      - MQTT_PASSWORD=bridge-dev
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The broker, same image as the Railway service. Credentials here are local-only throwaways;
  # the real ones are per prop and issued by `pnpm mqtt:credentials` — see docs/MQTT_SETUP.md.
  mqtt:
    container_name: terra-prime-mqtt
    build:
      context: ./mqtt
      dockerfile: Dockerfile
    ports:
      - 1883:1883
    environment:
      - MQTT_PORT=1883
      - MQTT_BRIDGE_USERNAME=tp-bridge
      - MQTT_BRIDGE_PASSWORD=bridge-dev
      - MQTT_LIGHT_USERNAME=tp-light
      - MQTT_LIGHT_PASSWORD=light-dev
      # One bench device, so a handheld on the desk can join without anyone issuing credentials.
      - MQTT_DEVICE_CREDENTIALS=[{"uid":"bench-01","password":"bench-dev","roles":["aguesguard"]}]
    volumes:
      - mqtt-data:/mosquitto/data

  db:
    container_name: terra-prime-db
    image: mysql/mysql-server:latest
    ports:
      - 3307:3306
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=testaliceDB
      - MYSQL_USER=yodi
      - MYSQL_PASSWORD=Tester@123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  migrate:
    container_name: terra-prime-migrate
    build:
      context: ./site
      dockerfile: dockerfile
      target: migrate-runner
    env_file:
      - ./site/.env
    environment:
      - MYSQLHOST=db
      - MYSQLPORT=3306
      - MYSQLUSER=yodi
      - MYSQLPASSWORD=Tester@123
      - MYSQLDATABASE=testaliceDB
    depends_on:
      db:
        condition: service_healthy

  phpnyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8081:80
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    stdin_open: true

  # tunnel:
  #   container_name: cloudflared-tunnel
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate  run
  #   environment:
  #     - TUNNEL_TOKEN=eyJhIjoiMjliYTJlMmJiMmM1NjUwNTJiZGZlZjMwOTczYjY0NmYiLCJ0IjoiN2ZkZGIwODUtOTBkOS00ZjcwLWJhNjQtNzFiODU3ODQxYTM2IiwicyI6Ik1UTmtNelZtTmpNdFpUQmlPQzAwTkdSakxXSXdOalV0TW1Fd01HUmlPV1k1TWpkbCJ9
  #
volumes:
  db-data:
  mqtt-data:

networks:
  default:
    name: terra-prime
