services:
  sveltekit:
    container_name: terra-prime-sveltekit
    build:
      context: ./site
      dockerfile: dockerfile
      target: dev
    ports:
      - 5173:5173
    volumes:
      - ./site:/app
      - /app/node_modules
    env_file:
      - ./site/.env
    environment:
      - MYSQLHOST=db
      - MYSQLPORT=3306
      # Browser connects to the broker's WebSocket listener (mapped to the host).
      - PUBLIC_MQTT_WS_URL=ws://localhost:9001
    depends_on:
      migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_started

  mqtt:
    container_name: terra-prime-mqtt
    image: eclipse-mosquitto:2
    ports:
      - 1883:1883   # MQTT/TCP (CYD devices)
      - 9001:9001   # MQTT/WebSocket (browser)
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf

  coordinator:
    container_name: terra-prime-coordinator
    build:
      context: ./site
      dockerfile: dockerfile
      target: dev
    command: pnpm start:mqtt
    volumes:
      - ./site:/app
      - /app/node_modules
    environment:
      - MQTT_URL=mqtt://mqtt:1883
    depends_on:
      mqtt:
        condition: service_started

  db:
    container_name: terra-prime-db
    image: mysql/mysql-server:latest
    ports:
      - 3307:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=testaliceDB
      - MYSQL_USER=yodi
      - MYSQL_PASSWORD=Tester@123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  migrate:
    container_name: terra-prime-migrate
    build:
      context: ./site
      dockerfile: dockerfile
      target: migrate-runner
    env_file:
      - ./site/.env
    environment:
      - MYSQLHOST=db
      - MYSQLPORT=3306
    depends_on:
      db:
        condition: service_healthy

  phpnyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8081:80
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    stdin_open: true

