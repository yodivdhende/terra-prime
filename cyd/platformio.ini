; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = lib
lib_deps =
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
	; The realtime transport. PubSubClient rather than an async client because the firmware is
	; already a cooperative `loop()` — `mqttLoop()` sits beside `uiLoop()` and `powerLoop()` and
	; needs no callbacks running off another task next to LVGL's single-threaded renderer. Its
	; CONNECT carries the last will, which is the whole reason this device is on MQTT at all.
	knolleary/PubSubClient@^2.8