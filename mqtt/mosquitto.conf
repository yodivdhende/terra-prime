# Mosquitto config for terra-prime realtime (site <-> CYD).
# Two listeners: MQTT/TCP for the CYD devices, MQTT-over-WebSocket for the browser.

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Local dev: anonymous access. Add auth/TLS before exposing the broker publicly.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
