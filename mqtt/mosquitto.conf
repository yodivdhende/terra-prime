# Mosquitto configuration for the Terra Prime broker.
#
# `__MQTT_PORT__` is replaced by `entrypoint.sh` at container start — Railway hands a service its
# port in the environment, and mosquitto has no way to read one.
#
# `passwd` and `acl` are written by the same script from environment variables and are never in
# the image: props are physically handed to players, so a broker credential baked into a layer is
# a credential that leaks the first time anyone pulls the image.

listener __MQTT_PORT__
protocol mqtt

# No shared credential, ever. Every publisher and subscriber authenticates as itself, which is
# what makes the per-device ACL below mean anything.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Retained device status has to survive a redeploy: it is the fleet's only record of who was
# online, and a broker that forgets it makes every prop in the building look dead until it next
# speaks. Needs a Railway volume mounted here — see `docs/MQTT_SETUP.md`.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
