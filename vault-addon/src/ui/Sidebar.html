<?!= include('ui/Stylesheet'); ?>

<div id="vl-setup" class="vl-hidden">
	<h2>Set up your vault</h2>
	<p class="vl-muted">Paste the Google Drive folder ID or URL you want Vault Links to index. Only Google Docs inside this folder (and its subfolders) will ever be read.</p>
	<input type="text" id="vl-folder-input" placeholder="Folder ID or https://drive.google.com/drive/folders/..." />
	<p id="vl-setup-error" class="vl-muted vl-hidden"></p>
	<button class="primary" id="vl-setup-save">Save vault folder</button>
</div>

<div id="vl-main" class="vl-hidden">
	<h2>Vault Links</h2>
	<p class="vl-muted" id="vl-vault-name"></p>

	<input type="text" id="vl-search" placeholder="Search vault files..." />
	<ul class="vl-file-list" id="vl-file-list"></ul>
	<button id="vl-refresh">Refresh index</button>

	<div class="vl-section">
		<h3>Tags</h3>
		<ul class="vl-file-list" id="vl-tag-list"></ul>
	</div>

	<div class="vl-section">
		<h3>Headings in this doc</h3>
		<ul class="vl-file-list" id="vl-heading-list"></ul>
	</div>

	<div class="vl-section">
		<h3>Links from this doc</h3>
		<ul class="vl-file-list" id="vl-outbound-list"></ul>
	</div>

	<div class="vl-section">
		<h3>Links to this doc</h3>
		<ul class="vl-file-list" id="vl-backlink-list"></ul>
	</div>
</div>

<?!= include('ui/ClientUtil'); ?>
<script>
	document.addEventListener('DOMContentLoaded', init);

	function init() {
		runServer('isVaultConfigured').then(function (configured) {
			if (configured) {
				showMain();
			} else {
				showView('vl-setup');
			}
		});
	}

	function showView(id) {
		['vl-setup', 'vl-main'].forEach(function (elId) {
			document.getElementById(elId).classList.toggle('vl-hidden', elId !== id);
		});
	}

	function showMain() {
		showView('vl-main');
		loadFileList('');
		loadHeadingList();
		loadLinkPanels();
		loadTagList();
	}

	function loadTagList() {
		runServer('buildTagIndex').then(renderTagList);
	}

	function renderTagList(tagIndex) {
		var list = document.getElementById('vl-tag-list');
		list.innerHTML = '';
		if (!tagIndex.length) {
			var empty = document.createElement('li');
			empty.className = 'vl-muted';
			empty.textContent = 'No #tags found in this vault yet.';
			list.appendChild(empty);
			return;
		}
		tagIndex.forEach(function (entry) {
			var li = document.createElement('li');
			var button = document.createElement('button');
			button.textContent = entry.tag + ' (' + entry.docs.length + ')';
			button.addEventListener('click', function () {
				renderFileList(entry.docs);
			});
			li.appendChild(button);
			list.appendChild(li);
		});
	}

	function loadLinkPanels() {
		runServer('getActiveDocId').then(function (docId) {
			runServer('getOutboundLinksForDoc', docId).then(function (links) {
				renderLinkList('vl-outbound-list', links, function (link) {
					return link.targetName;
				});
			});
			runServer('getBacklinksForDoc', docId).then(function (links) {
				renderLinkList('vl-backlink-list', links, function (link) {
					return link.sourceName;
				});
			});
		});
	}

	function renderLinkList(listId, links, nameOf) {
		var list = document.getElementById(listId);
		list.innerHTML = '';
		if (!links.length) {
			var empty = document.createElement('li');
			empty.className = 'vl-muted';
			empty.textContent = 'None yet.';
			list.appendChild(empty);
			return;
		}
		links.forEach(function (link) {
			var li = document.createElement('li');
			var name = document.createElement('div');
			name.textContent = nameOf(link);
			var meta = document.createElement('div');
			meta.className = 'vl-path';
			meta.textContent = link.text;
			li.appendChild(name);
			li.appendChild(meta);
			list.appendChild(li);
		});
	}

	function loadHeadingList() {
		runServer('getActiveDocHeadings').then(renderHeadingList);
	}

	function renderHeadingList(headings) {
		var list = document.getElementById('vl-heading-list');
		list.innerHTML = '';
		if (!headings.length) {
			var empty = document.createElement('li');
			empty.className = 'vl-muted';
			empty.textContent = 'No headings in this doc yet.';
			list.appendChild(empty);
			return;
		}
		headings.forEach(function (heading) {
			var li = document.createElement('li');
			li.style.paddingLeft = (heading.level - 1) * 12 + 'px';
			var text = document.createElement('div');
			text.textContent = heading.text || '(untitled heading)';
			var meta = document.createElement('div');
			meta.className = 'vl-path';
			meta.textContent = heading.headingId ? 'H' + heading.level + ' · ' + heading.headingId : 'H' + heading.level + ' · anchor not generated yet';
			li.appendChild(text);
			li.appendChild(meta);
			list.appendChild(li);
		});
	}

	document.getElementById('vl-setup-save').addEventListener('click', function () {
		var input = document.getElementById('vl-folder-input').value;
		var errorEl = document.getElementById('vl-setup-error');
		errorEl.classList.add('vl-hidden');
		runServer('setVaultFolderId', input)
			.then(function () {
				showMain();
			})
			.catch(function (err) {
				errorEl.textContent = err && err.message ? err.message : String(err);
				errorEl.classList.remove('vl-hidden');
			});
	});

	document.getElementById('vl-refresh').addEventListener('click', function () {
		runServer('refreshVaultIndex').then(renderFileList);
	});

	var onSearchInput = debounce(function () {
		loadFileList(document.getElementById('vl-search').value);
	}, 200);

	document.getElementById('vl-search').addEventListener('input', onSearchInput);

	function loadFileList(query) {
		runServer('searchVaultDocs', query).then(renderFileList);
	}

	function renderFileList(docs) {
		var list = document.getElementById('vl-file-list');
		list.innerHTML = '';
		if (!docs.length) {
			var empty = document.createElement('li');
			empty.className = 'vl-muted';
			empty.textContent = 'No files found.';
			list.appendChild(empty);
			return;
		}
		docs.forEach(function (doc) {
			list.appendChild(buildFileListItem_(doc));
		});
	}

	function buildFileListItem_(doc) {
		var li = document.createElement('li');

		var row = document.createElement('div');
		var name = document.createElement('span');
		name.textContent = doc.name;
		row.appendChild(name);
		li.appendChild(row);

		var path = document.createElement('div');
		path.className = 'vl-path';
		path.textContent = doc.path || '';
		li.appendChild(path);

		var actions = document.createElement('div');

		var insertWholeDocButton = document.createElement('button');
		insertWholeDocButton.textContent = 'Insert link';
		insertWholeDocButton.addEventListener('click', function () {
			insertLink_(doc.id, null, doc.name);
		});
		actions.appendChild(insertWholeDocButton);

		var expandButton = document.createElement('button');
		expandButton.textContent = 'Headings';
		var headingList = document.createElement('ul');
		headingList.className = 'vl-file-list vl-hidden';
		expandButton.addEventListener('click', function () {
			var willShow = headingList.classList.contains('vl-hidden');
			headingList.classList.toggle('vl-hidden', !willShow);
			if (willShow && !headingList.dataset.loaded) {
				headingList.dataset.loaded = '1';
				runServer('getDocHeadingsWithAnchors', doc.id).then(function (headings) {
					renderInsertableHeadingList_(headingList, doc, headings);
				});
			}
		});
		actions.appendChild(expandButton);

		li.appendChild(actions);
		li.appendChild(headingList);
		return li;
	}

	function renderInsertableHeadingList_(container, doc, headings) {
		container.innerHTML = '';
		if (!headings.length) {
			var empty = document.createElement('li');
			empty.className = 'vl-muted';
			empty.textContent = 'No headings in this file.';
			container.appendChild(empty);
			return;
		}
		headings.forEach(function (heading) {
			var li = document.createElement('li');
			li.style.paddingLeft = (heading.level - 1) * 12 + 'px';
			var text = document.createElement('div');
			text.textContent = heading.text || '(untitled heading)';
			li.appendChild(text);

			var insertButton = document.createElement('button');
			insertButton.textContent = 'Insert link';
			insertButton.addEventListener('click', function () {
				insertLink_(doc.id, heading.headingId, heading.text || doc.name);
			});
			li.appendChild(insertButton);
			container.appendChild(li);
		});
	}

	function insertLink_(targetDocId, headingId, displayText) {
		runServer('insertLinkFromBrowser', targetDocId, headingId, displayText).catch(function (err) {
			window.alert(err && err.message ? err.message : String(err));
		});
	}
</script>
